# Production-style stack. Put a TLS reverse proxy (Caddy, nginx, Traefik) in front of `frontend` and `backend`.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sinajokar}
      POSTGRES_USER: ${POSTGRES_USER:-sinajokar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinajokar"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sinajokar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sinajokar}
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - media:/app/backend/media
    ports:
      - "127.0.0.1:8000:8000"   # admin + API docs; expose through your reverse proxy only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')"]
      interval: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  media:
