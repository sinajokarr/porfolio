<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Antalya Smile Tour — Jokar Dental</title>
<style>
@font-face{font-family:Vaz;src:url(fonts/vazirmatn-arabic-900-normal.woff2);font-weight:900}
@font-face{font-family:Vaz;src:url(fonts/vazirmatn-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:Fred;src:url(fonts/fredoka-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Fred;src:url(fonts/fredoka-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Fred;src:url(fonts/fredoka-latin-ext-700-normal.woff2);font-weight:700;unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Fred;src:url(fonts/fredoka-latin-ext-600-normal.woff2);font-weight:600;unicode-range:U+0100-024F,U+1E00-1EFF}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000}
.scene{position:absolute;inset:0;display:none;will-change:transform}
.scene>svg,#hud,#ovl{position:absolute;inset:0}
.fa{font-family:Vaz,Fred;direction:rtl}
.en{font-family:Fred}
.stroke{paint-order:stroke fill}
.cap{position:absolute;left:50%;bottom:64px;transform-origin:50% 100%;opacity:0;display:flex;flex-direction:column;align-items:center;
  background:#fff;border:6px solid #173a6a;border-radius:44px;padding:14px 56px 16px;box-shadow:0 10px 0 #173a6a;white-space:nowrap}
.cap .fa{font-weight:900;font-size:64px;color:#173a6a;line-height:1.25;display:flex;align-items:center;gap:16px}
.cap .en{font-weight:600;font-size:34px;color:#0a8f9a;letter-spacing:1px;margin-top:-2px}
#title{position:absolute;left:0;right:0;top:110px;text-align:center}
.t1{font-family:Vaz;font-weight:900;font-size:150px;color:#fff;-webkit-text-stroke:20px #173a6a;paint-order:stroke fill;direction:rtl;line-height:1.2}
.t2{font-family:Fred;font-weight:700;font-size:76px;color:#ffde4a;letter-spacing:12px;-webkit-text-stroke:12px #173a6a;paint-order:stroke fill;margin-top:4px}
.t3{display:inline-block;margin-top:22px;font-family:Fred;font-weight:600;font-size:34px;color:#173a6a;background:#fff;border-radius:40px;padding:8px 34px;box-shadow:0 6px 0 #173a6a}
.t3 span{font-family:Vaz;font-weight:700}
#end{position:absolute;left:0;right:0;top:500px;text-align:center}
#end .a{font-family:Vaz;font-weight:900;font-size:124px;color:#fff;-webkit-text-stroke:16px #0b4a63;paint-order:stroke fill;direction:rtl;line-height:1.2}
#end .b{font-family:Fred;font-weight:700;font-size:70px;color:#ffde4a;letter-spacing:12px;-webkit-text-stroke:10px #0b4a63;paint-order:stroke fill}
#end .cpill{display:inline-flex;align-items:center;gap:14px;margin-top:22px;background:#fff;border-radius:60px;padding:10px 40px;font-family:Fred;font-weight:700;font-size:50px;color:#0b6c8a;box-shadow:0 8px 0 #0b4a63}
#end .d{font-family:Vaz;font-weight:700;font-size:56px;color:#fff;direction:rtl;margin-top:34px;-webkit-text-stroke:9px #0b4a63;paint-order:stroke fill}
#end .e{font-family:Fred;font-weight:600;font-size:34px;color:#dffcff;margin-top:2px}
#end>div{opacity:0;transform-origin:50% 50%}
#logo{position:absolute;right:40px;top:34px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:40px;padding:8px 22px 8px 14px;
  font-family:Fred;font-weight:700;font-size:28px;color:#173a6a;letter-spacing:2px;box-shadow:0 5px 0 rgba(23,58,106,.6);opacity:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,20,50,.28) 100%)}
</style></head>
<body><div id="stage">
<svg width="0" height="0" style="position:absolute">
 <defs>
  <radialGradient id="toothShade" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".75" stop-color="#f4f7fb"/><stop offset="1" stop-color="#d7e1ee"/></radialGradient>
  <path id="star" d="M0,-1 Q0.12,-0.12 1,0 Q0.12,0.12 0,1 Q-0.12,0.12 -1,0 Q-0.12,-0.12 0,-1Z"/>
  <g id="cloud"><circle cx="0" cy="0" r="60" fill="#fff"/><circle cx="60" cy="-28" r="72" fill="#fff"/><circle cx="125" cy="0" r="58" fill="#fff"/><circle cx="62" cy="18" r="60" fill="#fff"/></g>
  <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18c2dd"/><stop offset="1" stop-color="#0a7fb5"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
 </defs>
</svg>
<div id="scenes"></div>
<div id="vign"></div>
<svg id="hud" viewBox="0 0 1920 1080"></svg>
<div id="logo"><svg width="42" height="46" viewBox="20 0 160 220"><path d="M40,30 C60,5 85,20 100,25 C115,20 140,5 160,30 C185,60 175,110 165,140 C158,165 155,210 140,210 C125,210 122,160 100,160 C78,160 75,210 60,210 C45,210 42,165 35,140 C25,110 15,60 40,30Z" fill="#fff" stroke="#173a6a" stroke-width="14"/><path d="M72,112 Q100,140 128,112" stroke="#173a6a" stroke-width="12" fill="none" stroke-linecap="round"/></svg>JOKAR DENTAL</div>
<div id="title">
  <div class="t1" id="t1">تور لبخند آنتالیا</div>
  <div class="t2" id="t2">ANTALYA SMILE TOUR</div>
  <div id="t3w"><div class="t3">presented by JOKAR DENTAL · <span>دندانپزشکی جوکار</span></div></div>
</div>
<div id="caps"></div>
<div id="end">
  <div class="a">دندانپزشکی جوکار</div>
  <div class="b">JOKAR DENTAL</div>
  <div class="c"><div class="cpill"><svg width="36" height="50" viewBox="0 0 44 60"><path d="M22,58 C22,58 2,32 2,21 A20,20 0 0 1 42,21 C42,32 22,58 22,58Z" fill="#ff5d73"/><circle cx="22" cy="21" r="8" fill="#fff"/></svg>ANTALYA · TÜRKİYE</div></div>
  <div class="d">لبخندت رو بیار، بقیه‌ش با ما!</div>

</div>

<script>
const W=1920,H=1080,TR=.5;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=x=>1-Math.pow(1-x,3);
const easeIn=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const backOut=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const elastic=x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1;
const hop=(t,rate,h)=>-Math.abs(Math.sin(t*Math.PI*rate))*h;
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const add=(parent,html)=>{parent.insertAdjacentHTML('beforeend',html);return parent.lastElementChild};
const q=(g,c)=>g.querySelector('.'+c);
const tr=(x,y,s=1,r=0)=>`translate(${x},${y}) rotate(${r}) scale(${s})`;
const show=(e,v)=>{e.style.display=v?'':'none'};

/* ================= TOOTH CHARACTER ================= */
const TOOTH="M40,30 C60,5 85,20 100,25 C115,20 140,5 160,30 C185,60 175,110 165,140 C158,165 155,210 140,210 C125,210 122,160 100,160 C78,160 75,210 60,210 C45,210 42,165 35,140 C25,110 15,60 40,30Z";
function mouthPath(m){const K=[[132,-16,-16],[120,14,14],[114,6,48]];const i=Math.min(1,Math.floor(clamp(m,0,2))),f=clamp(m,0,2)-i;
  const [y,c1,c2]=K[i].map((v,j)=>lerp(v,K[i+1][j],f));const w=lerp(26,31,clamp(m-1));
  return `M${100-w},${y} Q100,${y+c1} ${100+w},${y} Q100,${y+c2} ${100-w},${y}Z`}
function Tooth(parent){
  const g=add(parent,`<g>
  <ellipse class="sh" cx="100" cy="224" rx="66" ry="11" fill="#000" opacity=".18"/>
  <g class="bd">
   <path class="aL" stroke="#173a6a" stroke-width="7" fill="none" stroke-linecap="round"/>
   <path class="aR" stroke="#173a6a" stroke-width="7" fill="none" stroke-linecap="round"/>
   <path d="${TOOTH}" fill="url(#toothShade)" stroke="#173a6a" stroke-width="6" stroke-linejoin="round"/>
   <path d="M52,45 C62,32 76,34 84,38" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
   <g class="st"><ellipse cx="142" cy="58" rx="15" ry="10" fill="#c9a46b"/><ellipse cx="58" cy="142" rx="9" ry="7" fill="#c9a46b"/><circle cx="150" cy="78" r="5" fill="#c9a46b"/><circle cx="128" cy="150" r="6" fill="#c9a46b"/></g>
   <circle cx="62" cy="112" r="11" fill="#ff9fb0" opacity=".7"/><circle cx="138" cy="112" r="11" fill="#ff9fb0" opacity=".7"/>
   <ellipse class="e1" cx="78" cy="86" rx="10" ry="13" fill="#173a6a"/><ellipse class="e2" cx="122" cy="86" rx="10" ry="13" fill="#173a6a"/>
   <g class="gli"><circle cx="81" cy="81" r="3.5" fill="#fff"/><circle cx="125" cy="81" r="3.5" fill="#fff"/></g>
   <path class="br" stroke="#173a6a" stroke-width="5" fill="none" stroke-linecap="round"/>
   <path class="mo" fill="#a8243b" stroke="#173a6a" stroke-width="5" stroke-linejoin="round"/>
   <path class="sw" d="M170,50 Q179,66 170,73 Q161,66 170,50Z" fill="#7fd3ff" stroke="#173a6a" stroke-width="3"/>
   <g class="gl">
    <path d="M47,72 H95 V92 Q95,106 80,106 H62 Q47,106 47,92Z" fill="#111" stroke="#173a6a" stroke-width="3"/>
    <path d="M105,72 H153 V92 Q153,106 138,106 H120 Q105,106 105,92Z" fill="#111" stroke="#173a6a" stroke-width="3"/>
    <path d="M95,78 Q100,74 105,78" stroke="#111" stroke-width="5" fill="none"/><path d="M47,76 L30,70 M153,76 L170,70" stroke="#111" stroke-width="5"/>
    <path d="M55,81 L67,81 M113,81 L125,81" stroke="#fff" stroke-width="4" opacity=".75" stroke-linecap="round"/></g>
   <g class="pL"></g><g class="pR"></g>
   <circle class="hL" r="12" fill="#fff" stroke="#173a6a" stroke-width="5"/><circle class="hR" r="12" fill="#fff" stroke="#173a6a" stroke-width="5"/>
   <use class="sp" href="#star" fill="#fff8b0" stroke="#ffb703" stroke-width=".07"/>
  </g></g>`);
  const P={};['sh','bd','aL','aR','st','e1','e2','gli','br','mo','sw','gl','pL','pR','hL','hR','sp'].forEach(c=>P[c]=q(g,c));
  const arm=(side,a)=>{const sx=side<0?40:160,sy=118,r=a*Math.PI/180;const ex=sx+side*62*Math.sin(r),ey=sy+62*Math.cos(r);
    const cx=(sx+ex)/2+side*10*Math.cos(r),cy=(sy+ey)/2-8*Math.sin(r);return {d:`M${sx},${sy} Q${cx},${cy} ${ex},${ey}`,ex,ey}};
  return {g,P,set(o){
    const d=Object.assign({x:0,y:0,s:1,rot:0,sx:1,sy:1,mouth:1,stain:0,gl:0,blink:1,aL:12,aR:12,sweat:0,shine:0,shadow:1,flip:1,brow:0,t:0},o);
    g.setAttribute('transform',`translate(${d.x},${d.y}) rotate(${d.rot}) scale(${d.s*d.sx*d.flip},${d.s*d.sy}) translate(-100,-120)`);
    P.sh.setAttribute('opacity',.18*d.shadow);
    P.mo.setAttribute('d',mouthPath(d.mouth));
    const sad=clamp(d.brow);P.br.setAttribute('d',`M64,${66-7*sad} L90,${66+4*sad} M110,${66+4*sad} L136,${66-7*sad}`);P.br.setAttribute('opacity',sad);
    P.st.setAttribute('opacity',d.stain);
    const bl=Math.max(.08,d.blink);P.e1.setAttribute('ry',13*bl);P.e2.setAttribute('ry',13*bl);P.gli.setAttribute('opacity',bl>.5?1:0);
    P.sw.setAttribute('opacity',d.sweat);P.sw.setAttribute('transform',`translate(0,${(d.t*30)%14})`);
    show(P.gl,d.gl>0);P.gl.setAttribute('transform',`translate(0,${lerp(-320,0,backOut(d.gl))})`);
    [[P.aL,P.hL,P.pL,-1,d.aL],[P.aR,P.hR,P.pR,1,d.aR]].forEach(([a,h,p,side,ang])=>{const A=arm(side,ang);a.setAttribute('d',A.d);
      h.setAttribute('cx',A.ex);h.setAttribute('cy',A.ey);p.setAttribute('transform',`translate(${A.ex},${A.ey})`)});
    show(P.sp,d.shine>0);P.sp.setAttribute('transform',`translate(150,40) rotate(${d.t*120}) scale(${22*d.shine*(1+.25*Math.sin(d.t*9))})`);
  }};
}
const blinkAt=(t,list)=>{let b=1;list.forEach(x=>{const d=Math.abs(t-x);if(d<.09)b=d/.09});return b};

/* ================= SHARED PROPS ================= */
const suitcase=`<g><rect x="-58" y="-6" width="116" height="84" rx="14" fill="#ff5d73" stroke="#173a6a" stroke-width="6"/><path d="M-22,-6 V-26 H22 V-6" fill="none" stroke="#173a6a" stroke-width="7"/>
 <path d="M-30,-6 V78 M30,-6 V78" stroke="#c93a52" stroke-width="7"/><rect x="-40" y="22" width="32" height="20" rx="4" fill="#ffde4a" stroke="#173a6a" stroke-width="3"/></g>`;
function Plane(parent,{body='#ffffff',accent='#12c2b4',windowFace=true}={}){
  const g=add(parent,`<g>
   <path d="M-520,-30 L-640,-230 L-560,-230 L-420,-40Z" fill="${accent}" stroke="#173a6a" stroke-width="8" stroke-linejoin="round"/>
   <path d="M-80,40 L-330,260 L-230,265 L60,60Z" fill="#cfe3f2" stroke="#173a6a" stroke-width="8" stroke-linejoin="round"/>
   <path d="M-600,-70 Q-640,0 -600,70 L420,80 Q560,70 580,0 Q560,-70 420,-80Z" fill="${body}" stroke="#173a6a" stroke-width="9" stroke-linejoin="round"/>
   <path d="M-600,30 L560,30 Q545,62 420,72 L-590,62Z" fill="${accent}" opacity=".9"/>
   <path d="M470,-62 Q540,-55 560,-12 L470,-12Z" fill="#9fe3ff" stroke="#173a6a" stroke-width="6"/>
   <g class="wins"></g>
   <path d="M-40,-40 L-260,-260 L-170,-265 L80,-50Z" fill="#b5d2e8" stroke="#173a6a" stroke-width="8" stroke-linejoin="round"/>
   <rect x="-160" y="80" width="120" height="44" rx="22" fill="#e6eef6" stroke="#173a6a" stroke-width="7"/>
   <g class="wheels"><path d="M-260,70 V120 M260,70 V120" stroke="#173a6a" stroke-width="10"/><circle cx="-260" cy="128" r="22" fill="#333" stroke="#173a6a" stroke-width="5"/><circle cx="260" cy="128" r="22" fill="#333" stroke="#173a6a" stroke-width="5"/></g>
   <g class="face"></g>
  </g>`);
  const wins=q(g,'wins');for(let i=0;i<9;i++){const x=-480+i*95;if(i===5&&windowFace)continue;add(wins,`<rect x="${x}" y="-34" width="48" height="56" rx="22" fill="#9fe3ff" stroke="#173a6a" stroke-width="5"/>`)}
  let tooth=null;
  if(windowFace){const id='wclip'+Math.floor(rnd()*1e9);
    add(q(g,'face'),`<g><clipPath id="${id}"><circle cx="0" cy="0" r="66"/></clipPath><circle r="74" fill="#173a6a"/><circle r="66" fill="#bff0ff"/><g class="in" clip-path="url(#${id})"></g><circle r="66" fill="none" stroke="#173a6a" stroke-width="8"/><path d="M-40,-30 A50,50 0 0 1 10,-55" stroke="#fff" stroke-width="8" fill="none" opacity=".7" stroke-linecap="round"/></g>`);
    q(g,'face').setAttribute('transform','translate(-2,-6)');tooth=Tooth(q(g,'in'))}
  return {g,tooth,wheels:q(g,'wheels')};
}
function palm(parent,x,y,s){const g=add(parent,`<g transform="${tr(x,y,s)}"><path d="M0,0 C10,-150 -20,-300 30,-470" stroke="#9a6a3b" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M0,0 C10,-150 -20,-300 30,-470" stroke="#7a5230" stroke-width="34" stroke-dasharray="6 34" fill="none"/><g class="lv" transform="translate(30,-470)"></g></g>`);
  const lv=q(g,'lv');const L=[];for(let i=0;i<7;i++)L.push({a:-180+i*30,p:add(lv,`<path d="M0,0 Q90,-60 220,10 Q100,-8 0,0Z" fill="${i%2?'#2e9e4f':'#3fbf62'}" stroke="#1e6e38" stroke-width="4"/>`)});
  return t=>{L.forEach((l,i)=>l.p.setAttribute('transform',`rotate(${l.a+Math.sin(t*2.2+i)*6})`))}}
function waves(parent,y0,n,col,gap=80){const P=[];for(let i=0;i<n;i++)P.push(add(parent,`<path fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" opacity=".75"/>`));
  return t=>P.forEach((w,i)=>{const y=y0+i*gap,off=(t*80*(i%2?1:-1)+i*70)%240;let d=`M${-480+off},${y}`;for(let x=-480+off;x<2200;x+=120)d+=' q30,-18 60,0 q30,18 60,0';w.setAttribute('d',d)})}
function polaroid(inner,cap){return `<g><rect x="-110" y="-125" width="220" height="250" rx="8" fill="#fff" stroke="#173a6a" stroke-width="5"/><svg x="-95" y="-110" width="190" height="180" viewBox="0 0 190 180"><rect width="190" height="180" fill="#bfefff"/>${inner}</svg>
 <text y="105" text-anchor="middle" font-family="Fred" font-weight="700" font-size="26" fill="#173a6a">${cap}</text></g>`}

/* ================= SCENES ================= */
const scenes=[];
function scene(start,end,trans,build){const div=add($('scenes'),`<div class="scene"><svg viewBox="0 0 1920 1080" width="1920" height="1080"><g class="cam"></g></svg></div>`);
  const cam=div.querySelector('.cam');scenes.push({start,end,trans,div,cam,update:build(cam)})}

// 1 — INTRO
scene(0,6,'none',c=>{
  add(c,`<defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1640"/><stop offset="1" stop-color="#3a3a7a"/></linearGradient>
  <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc8f5"/><stop offset=".6" stop-color="#ffc88a"/><stop offset="1" stop-color="#ff9a6b"/></linearGradient></defs>
  <rect width="1920" height="1080" fill="url(#night)"/><rect class="dawn" width="1920" height="1080" fill="url(#dawn)"/>`);
  const stars=add(c,'<g></g>');const S=[];for(let i=0;i<90;i++)S.push({e:add(stars,`<use href="#star" fill="#fff"/>`),x:rnd()*1920,y:rnd()*700,s:3+rnd()*6,p:rnd()*6});
  const sun=add(c,`<g><circle r="420" fill="url(#sunGlow)"/><circle r="170" fill="#ffd23f" stroke="#ffb703" stroke-width="10"/></g>`);
  add(c,`<path d="M0,820 L200,640 L380,740 L560,560 L760,720 L940,600 L1140,740 L1340,590 L1540,720 L1720,620 L1920,700 V900 H0Z" fill="#6b6fa8"/>
  <path d="M0,860 L260,720 L480,800 L700,690 L920,810 L1180,700 L1420,800 L1660,710 L1920,780 V900 H0Z" fill="#4e5590"/>`);
  add(c,`<rect y="860" width="1920" height="220" fill="url(#seaG)"/>`);
  const refl=add(c,'<g></g>');for(let i=0;i<7;i++)add(refl,`<rect x="${960-140+i*7}" y="${880+i*26}" width="${280-i*14*2}" height="9" rx="5" fill="#fff3b0" opacity=".7"/>`);
  const wv=waves(c,900,3,'#bff3ff',60);
  const T=Tooth(c);
  const sp=add(c,'<g></g>');const SP=[];for(let i=0;i<10;i++)SP.push({e:add(sp,`<use href="#star" fill="#fff8b0" stroke="#ffb703" stroke-width=".06"/>`),a:i/10*6.28,d:230+rnd()*80,ph:rnd()*6});
  return t=>{const dawn=eio(prog(t,.2,3.4));c.querySelector('.dawn').setAttribute('opacity',dawn);
    S.forEach(s=>{s.e.setAttribute('transform',`translate(${s.x},${s.y}) scale(${s.s*(.6+.4*Math.sin(t*4+s.p))})`);s.e.setAttribute('opacity',1-dawn)});

  const defs=[[`<rect y="0" width="190" height="180" fill="#9fdcff"/><path d="M0,40 H70 V180 H0Z" fill="#a8774f"/><path d="M70,40 h30 v140 h-30z" fill="#fff"/><rect y="140" width="190" height="40" fill="#18a8d6"/>`,'Düden',330,250,-10],
    [`<rect width="190" height="180" fill="#ffe9c2"/><rect x="25" y="50" width="140" height="90" fill="#d9b98c" stroke="#173a6a" stroke-width="4"/><path d="M45,140 V95 A20,20 0 0 1 85,95 V140Z M105,140 V95 A20,20 0 0 1 145,95 V140Z" fill="#7fc8ea" stroke="#173a6a" stroke-width="3"/>`,'Kaleiçi',1590,250,9],
    [`<rect width="190" height="180" fill="#ff9f7a"/><circle cx="120" cy="100" r="34" fill="#ffd23f"/><rect y="110" width="190" height="70" fill="#7a4a8a"/><path d="M50,140 H130 L120,160 H60Z" fill="#9a5a2e"/><path d="M80,140 V70 L120,138Z" fill="#fff"/>`,'Konyaaltı',360,800,7],
    [`<rect width="190" height="180" fill="#bff7ef"/><g transform="translate(45,22) scale(.5)"><path d="${TOOTH}" fill="#fff" stroke="#173a6a" stroke-width="8"/><path d="M70,114 Q100,170 130,114Z" fill="#a8243b" stroke="#173a6a" stroke-width="8"/></g>`,'New smile!',1560,800,-8]];
  const PL=defs.map(([inner,cap,x,y,r],i)=>({e:add(pols,polaroid(inner,cap)),x,y,r,t0:.6+i*.45}));
  return t=>{S.forEach(s=>s.e.setAttribute('transform',`translate(${s.x},${s.y}) scale(${s.s*(.6+.4*Math.sin(t*4+s.p))})`));
    C.forEach(k=>{const x=((k.x+t*500)%2600+2600)%2600-400;k.e.setAttribute('transform',tr(x,k.y,k.s))});
    P.g.setAttribute('transform',`translate(${lerp(2400,960,easeOut(prog(t,-.4,1.2)))+Math.sin(t*1.4)*16},${540+Math.sin(t*2)*14}) rotate(${Math.sin(t*2+1)*1.5}) scale(-.78,.78)`);
    P.tooth.set({x:0,y:30,s:.62,mouth:2,gl:1,aL:12,aR:150+Math.sin(t*13)*22,shadow:0,flip:-1,t,shine:.7});
    PL.forEach(p=>{const k=prog(t,p.t0,p.t0+.5);p.e.setAttribute('transform',`translate(${p.x},${p.y+lerp(400,0,backOut(k))+Math.sin(t*2+p.x)*6}) rotate(${p.r*backOut(k)+Math.sin(t*1.5+p.y)*2}) scale(${.85*k+.01})`)})};
});

// 12 — END CARD
scene(55,60,'iris',c=>{
  add(c,`<defs><linearGradient id="endG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12c2b4"/><stop offset="1" stop-color="#0a6c9a"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#endG)"/>`);
  const rings=add(c,'<g fill="none" stroke="#fff" stroke-width="6"></g>');const RG=[0,1,2,3].map(()=>add(rings,'<circle cx="960" cy="290"/>'));
  const conf=add(c,'<g></g>');const CF=[];const cc=['#ffde4a','#ff5d73','#ffffff','#7fe0ff','#9dff8a'];
  for(let i=0;i<110;i++)CF.push({e:add(conf,`<rect width="18" height="30" rx="4" fill="${cc[i%5]}"/>`),x:rnd()*1920,y0:-80-rnd()*900,v:260+rnd()*320,w:rnd()*8,ph:rnd()*6});
  const T=Tooth(c);
  return t=>{RG.forEach((r,i)=>{const p=((t*.45)+i/4)%1;r.setAttribute('r',120+p*900);r.setAttribute('opacity',(1-p)*.22)});
    CF.forEach(k=>{const y=k.y0+t*k.v;k.e.setAttribute('transform',`translate(${k.x+Math.sin(t*3+k.ph)*40},${y}) rotate(${t*200*k.w+k.ph*60})`)});
    const e=prog(t,0,.6);T.set({x:960,y:lerp(-200,270,backOut(e))+Math.sin(t*4)*8,s:1.25,mouth:2,gl:1,aR:150+Math.sin(t*12)*20,aL:20,shine:1,shadow:0,rot:Math.sin(t*4)*4,t})};
});

/* ================= HUD & CAPTIONS ================= */
const hud=$('hud');
const steps=[{fa:'سفر',a:6,b:21,icon:`<path d="M-22,4 L22,-4 M-6,-16 L4,0 L-6,16" stroke="#173a6a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`},
  {fa:'کلینیک',a:21,b:31,icon:`<path d="M-18,-6 H-6 V-18 H6 V-6 H18 V6 H6 V18 H-6 V6 H-18Z" fill="#ff5d73" stroke="#173a6a" stroke-width="4"/>`},
  {fa:'لبخند',a:31,b:38,icon:`<use href="#star" transform="scale(22)" fill="#ffde4a" stroke="#173a6a" stroke-width=".18"/>`},
  {fa:'گردش',a:38,b:50,icon:`<circle r="11" fill="#ffd23f" stroke="#173a6a" stroke-width="4"/>${Array.from({length:8},(_,i)=>`<path d="M0,-16 V-22" stroke="#173a6a" stroke-width="4" stroke-linecap="round" transform="rotate(${i*45})"/>`).join('')}`},
  {fa:'بازگشت',a:50,b:55,icon:`<path d="M-18,2 L0,-16 L18,2 V18 H-18Z" fill="#12c2b4" stroke="#173a6a" stroke-width="4" stroke-linejoin="round"/>`}];
const HX=640,HW=640,HY=78;
const hudG=add(hud,`<g><rect x="${HX-70}" y="${HY-52}" width="${HW+140}" height="140" rx="40" fill="#fff" opacity=".92"/><rect x="${HX}" y="${HY-5}" width="${HW}" height="10" rx="5" fill="#d7e1ee"/><rect class="fill" x="${HX}" y="${HY-5}" width="0" height="10" rx="5" fill="#12c2b4"/></g>`);
const hFill=q(hudG,'fill');
const SG=steps.map((s,i)=>{const x=HX+i*HW/4;const g=add(hudG,`<g transform="translate(${x},${HY})"><g class="ic"><circle r="34" fill="#fff" stroke="#173a6a" stroke-width="5" class="bg"/>${s.icon}</g>
  <text y="66" text-anchor="middle" font-family="Vaz" font-weight="700" font-size="24" fill="#173a6a">${s.fa}</text></g>`);return {g,ic:q(g,'ic'),bg:q(g,'bg'),...s}});

const capData=[[6.3,8.3,'لبخندت خسته‌ست؟','Is your smile tired?'],[8.4,10.4,'وقت یه سفره!','Time for a trip!'],[10.9,14.3,'مقصد: آنتالیا','Next stop: Antalya'],
  [17.6,20.9,'خوش اومدی به آنتالیا!','Welcome to Antalya!'],[21.4,24.4,'دندانپزشکی جوکار','Jokar Dental Clinic'],[25.0,30.8,'معاینه و برنامه‌ی درمان','Check-up & Treatment Plan'],
  [31.4,33.7,'آماده‌ای؟','Ready?'],[34.4,37.8,'یه لبخند تازه!','A brand-new smile!'],
  [38.3,41.9,'آبشار دودن','Düden Waterfalls',1],[42.3,45.9,'شهر قدیم کالئیچی','Kaleiçi Old Town',1],[46.3,49.9,'ساحل کنیالتی','Konyaaltı Beach',1],
  [50.6,54.8,'با یه لبخند تازه برگرد خونه','Fly home with a brand-new smile']];
const pin=`<svg width="40" height="54" viewBox="0 0 44 60"><path d="M22,58 C22,58 2,32 2,21 A20,20 0 0 1 42,21 C42,32 22,58 22,58Z" fill="#ff5d73" stroke="#173a6a" stroke-width="3"/><circle cx="22" cy="21" r="8" fill="#fff"/></svg>`;
const caps=capData.map(([a,b,fa,en,loc])=>({a,b,e:add($('caps'),`<div class="cap"><div class="fa">${fa}${loc?pin:''}</div><div class="en">${en}</div></div>`)}));

/* ================= MAIN RENDER ================= */
function render(t){
  $('flash').dataset.extra=0;
  scenes.forEach((s,i)=>{const next=scenes[i+1];const vis=t>=s.start-(s.trans==='none'?0:TR)&&t<s.end+(next&&next.trans==='whip'?0:0);
    s.div.style.display=vis?"block":"none";if(!vis)return;
    let tx=0,blur=0,clip='none';
    if(t<s.start){const p=eio(prog(t,s.start-TR,s.start));
      if(s.trans==='whip'){tx=(1-p)*W;blur=Math.sin(p*Math.PI)*16}
      if(s.trans==='iris'){clip=`circle(${p*1150}px at 50% 50%)`}}
    if(next&&next.trans==='whip'&&t>=next.start-TR){const p=eio(prog(t,next.start-TR,next.start));tx=-p*W;blur=Math.sin(p*Math.PI)*16}
    s.div.style.transform=`translateX(${tx}px)`;s.div.style.filter=blur>.5?`blur(${blur}px)`:'none';s.div.style.clipPath=clip;
    s.update(t-s.start)});
  // title
  const ti=[['t1',.5],['t2',1.0],['t3w',1.5]];ti.forEach(([id,a])=>{const p=prog(t,a,a+.6),o=prog(t,5.4,5.9);const e=$(id);e.style.opacity=p>0?1-o:0;e.style.transform=`scale(${elastic(p)}) translateY(${-o*40}px)`});
  // hud + logo
  const hv=prog(t,6.2,6.8)*(1-prog(t,54.5,55));hudG.setAttribute('opacity',hv);hudG.setAttribute('transform',`translate(0,${(1-hv)*-40})`);$('logo').style.opacity=hv;
  let fillW=0;SG.forEach((s,i)=>{const p=prog(t,s.a,s.b);if(t>=s.a)fillW=HW*(i/4)+(i<4?HW/4*p:0);
    const act=t>=s.a&&t<s.b;const pop=Math.exp(-((t-s.a)**2)/.02);s.ic.setAttribute('transform',`scale(${(act?1.22:1)+pop*.3})`);s.bg.setAttribute('fill',t>=s.a?(act?'#ffde4a':'#bff7ef'):'#fff')});
  hFill.setAttribute('width',Math.min(HW,fillW));
  // captions
  caps.forEach(c=>{const pin=prog(t,c.a,c.a+.5),pout=prog(t,c.b-.3,c.b);const vis=pin>0&&pout<1;c.e.style.display=vis?'flex':'none';if(!vis)return;
    c.e.style.opacity=1-pout;c.e.style.transform=`translateX(-50%) translateY(${pout*60}px) scale(${elastic(pin)*(1-pout*.15)}) rotate(${Math.sin(t*3)*.8}deg)`});
  // end card
  [['a',.5],['b',.8],['c',1.05],['d',1.4],['e',1.6]].forEach(([k,a])=>{const e=$('end').querySelector('.'+k);const p=prog(t,55+a,55+a+.5);e.style.opacity=p>0?1:0;e.style.transform=`scale(${elastic(p)})`});
  // flashes
  const f=Math.max(Math.exp(-((t-34)**2)/.02)*(t<34?Math.exp(-((t-34)**2)/.001):1),+$('flash').dataset.extra||0);$('flash').style.opacity=f;
  // fade in/out
  $('stage').style.opacity=Math.min(prog(t,0,.4),1-prog(t,59.5,60));
}
window.render=render;render(0);
</script></body></html>
