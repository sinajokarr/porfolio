<script>
const W=1920,H=1080,TR=.6;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const backOut=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};

const pulse=(t,c,w)=>Math.exp(-((t-c)**2)/w);
let seed=21;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const add=(p,html)=>{p.insertAdjacentHTML('beforeend',html);return p.lastElementChild};
const q=(g,c)=>g.querySelector('.'+c);
const tr=(x,y,s=1,r=0)=>`translate(${x},${y}) rotate(${r}) scale(${s})`;

const blinkAt=(t,list)=>{let b=1;list.forEach(x=>{const d=Math.abs(t-x);if(d<.09)b=d/.09});return b};
const blinkLoop=(t,ph=0)=>{const p=((t+ph)%3.3);return p<.18?Math.abs(p-.09)/.09:1};
const OUT='#3a2340';

/* ================= PERSON ================= */
const CFG={
 reza:{skin:'#efc19c',hair:'#3a2618',top:'#4a7fc1',pants:'#2e3350',shoe:'#5a3a2a',style:'reza'},
 janan:{skin:'#f6cfb0',hair:'#16131d',top:'#ff6f8e',pants:'#f6cfb0',shoe:'#c23d5c',style:'janan'}};
function Person(parent,who,opt={}){
  const c=Object.assign({},CFG[who],opt);const R=c.style==='reza';
  const dress=!R;const suit=!!c.suit,bride=!!c.bride;
  const top=suit?'#2f3350':bride?'#fffaf5':c.top;
  const g=add(parent,`<g>
  <ellipse class="sh" cx="0" cy="4" rx="58" ry="10" fill="#000" opacity=".15"/>

   ${bride?`<path d="M-34,-300 Q-120,-200 -110,-40 Q0,-20 110,-40 Q120,-200 34,-300Z" fill="#fff" opacity=".65" stroke="#e8dcd4" stroke-width="3"/>`:''}
   ${!R?`<path d="M-74,-240 Q-82,-322 0,-320 Q82,-322 74,-240 L84,-118 Q64,-100 44,-118 L32,-168 H-32 L-44,-118 Q-64,-100 -84,-118Z" fill="${c.hair}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>`:''}
  </g>
  <g class="legs"><path class="lL" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse class="fL" rx="17" ry="9"/><path class="lR" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse class="fR" rx="17" ry="9"/></g>
  <g class="up2">
   <path class="aL" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle class="hL" r="11"/>
   ${dress?`<path d="M-34,-152 Q-42,-110 -40,-92 L-66,-36 Q0,-20 66,-36 L40,-92 Q42,-110 34,-152 Q0,-162 -34,-152Z" fill="${top}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>
     <path d="M-40,-96 Q0,-86 40,-96" stroke="${bride?'#f2d7e0':'#fff'}" stroke-width="7" fill="none" opacity=".8"/>`
    :`<path d="M-38,-152 Q-46,-104 -42,-64 H42 Q46,-104 38,-152 Q0,-162 -38,-152Z" fill="${top}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>

   <g class="scarf" display="none"><path d="M-36,-160 Q0,-140 36,-160 L38,-146 Q0,-124 -38,-146Z" fill="#e0344f" stroke="${OUT}" stroke-width="4"/><path d="M16,-146 L22,-100 L36,-104 L28,-150Z" fill="#e0344f" stroke="${OUT}" stroke-width="4"/></g>
   <g class="head">
    <circle cx="-62" cy="-222" r="12" fill="${c.skin}" stroke="${OUT}" stroke-width="4"/><circle cx="62" cy="-222" r="12" fill="${c.skin}" stroke="${OUT}" stroke-width="4"/>
    <ellipse cx="0" cy="-226" rx="64" ry="62" fill="${c.skin}" stroke="${OUT}" stroke-width="5"/>
    ${R?`<path d="M-62,-234 Q-66,-170 0,-158 Q66,-170 62,-234 Q58,-206 38,-198 Q0,-186 -38,-198 Q-58,-206 -62,-234Z" fill="${c.hair}" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-24,-200 Q0,-214 24,-200 Q0,-194 -24,-200Z" fill="${c.hair}" stroke="${OUT}" stroke-width="3"/>`:''}
    <ellipse class="bl1" cx="-40" cy="-204" rx="13" ry="8" fill="#ff7f9a"/><ellipse class="bl2" cx="40" cy="-204" rx="13" ry="8" fill="#ff7f9a"/>
    <g class="eyes"></g>
    <path class="mo" stroke="${OUT}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    ${R?`<path d="M-66,-236 Q-70,-300 0,-302 Q70,-300 66,-236 Q60,-266 32,-276 Q0,-262 -32,-276 Q-60,-266 -66,-236Z" fill="${c.hair}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-30,-286 Q-10,-296 6,-282 M14,-290 Q34,-292 44,-276" stroke="#5a3e2a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="4" cy="-322" r="26" fill="${c.hair}" stroke="${OUT}" stroke-width="5"/><path d="M-8,-330 Q6,-338 16,-326" stroke="#5a3e2a" stroke-width="4" fill="none"/>
      <rect x="-14" y="-302" width="36" height="10" rx="5" fill="#c9a04a" stroke="${OUT}" stroke-width="3"/>

     :`<path d="M-70,-234 Q-72,-304 0,-306 Q72,-302 70,-232 Q58,-284 12,-272 Q-22,-262 -42,-278 Q-62,-266 -70,-234Z" fill="${c.hair}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>

       :`<g transform="translate(48,-282)"><circle r="12" fill="#ffd27a" stroke="${OUT}" stroke-width="3"/>${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-12" rx="7" ry="10" fill="#ff8fab" stroke="${OUT}" stroke-width="2.5" transform="rotate(${a})"/>`).join('')}<circle r="6" fill="#ffd27a"/></g>`}`}
   </g>

   <path class="aR" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle class="hR" r="11"/>
   <g class="pH"></g>
  </g></g>`);
  const P={};['sh','up','up2','legs','lL','lR','fL','fR','aL','aR','hL','hR','head','eyes','mo','bl1','bl2','pR','pH','scarf'].forEach(k=>P[k]=q(g,k));
  const sleeve=top, legCol=R?c.pants:c.skin;
  [P.lL,P.lR].forEach(l=>{l.setAttribute('stroke',legCol);l.setAttribute('stroke-width',R?24:17)});
  [P.fL,P.fR].forEach(f=>{f.setAttribute('fill',suit?'#1c1c28':c.shoe);f.setAttribute('stroke',OUT);f.setAttribute('stroke-width',4)});
  [P.aL,P.aR].forEach(a=>{a.setAttribute('stroke',sleeve);a.setAttribute('stroke-width',22)});
  [P.hL,P.hR].forEach(h=>{h.setAttribute('fill',c.skin);h.setAttribute('stroke',OUT);h.setAttribute('stroke-width',4)});
  // outline for legs & arms (drawn as a thicker dark stroke behind)
  const outl=[];[[P.lL,R?32:25],[P.lR,R?32:25],[P.aL,30],[P.aR,30]].forEach(([el,w])=>{const o=el.cloneNode();o.setAttribute('stroke',OUT);o.setAttribute('stroke-width',w);el.parentNode.insertBefore(o,el);outl.push([o,el])});
  const D2R=Math.PI/180;
  const limb=(x,y,a1,l1,a2,l2)=>{const kx=x+Math.sin(a1*D2R)*l1,ky=y+Math.cos(a1*D2R)*l1,ex=kx+Math.sin(a2*D2R)*l2,ey=ky+Math.cos(a2*D2R)*l2;return {d:`M${x},${y} L${kx},${ky} L${ex},${ey}`,ex,ey}};
  return {g,P,set(o){
    const d=Object.assign({x:0,y:0,s:1,flip:1,rot:0,drop:0,tL:0,sL:0,tR:0,sR:0,uL:8,fL:8,uR:-8,fR:-8,eyes:'open',mouth:'smile',blush:.4,tilt:0,look:0,blink:1,shadow:1,scarf:0,bob:0,t:0},o);
    g.setAttribute('transform',`translate(${d.x},${d.y}) rotate(${d.rot}) scale(${d.s*d.flip},${d.s})`);
    P.sh.setAttribute('opacity',.15*d.shadow);
    const up=`translate(0,${d.drop+d.bob})`;P.up.setAttribute('transform',up);P.up2.setAttribute('transform',up);
    const hipY=-66+d.drop;

    P.aL.setAttribute('d',AL.d);P.aR.setAttribute('d',AR.d);

    if(!R&&d.eyes!=='heart')e+=`<path d="M${-36+lx},${ey-8} L${-40+lx},${ey-13} M${36+lx},${ey-8} L${40+lx},${ey-13}" stroke="${OUT}" stroke-width="3.5" stroke-linecap="round"/>`;
    P.eyes.innerHTML=e;
    const my=R?-190:-196,mx=d.look*5;let m;

    else{m=`M${mx-13},${my-2} Q${mx},${my+10} ${mx+13},${my-2}`;P.mo.setAttribute('fill','none')}

// pose helpers
const walk=(t,rate=2.2,amp=26)=>{const a=Math.sin(t*Math.PI*rate)*amp;return {tL:a,sL:a-Math.max(0,-a)*.9-6,tR:-a,sR:-a-Math.max(0,a)*.9-6,uL:-a*.8,fL:-a*.6+6,uR:a*.8,fR:a*.6-6,bob:-Math.abs(Math.cos(t*Math.PI*rate))*6}};
const SIT={drop:34,tL:90,sL:2,tR:90,sR:-2};
const KNEEL={drop:34,tL:0,sL:-90,tR:90,sR:0};

/* ================= LUNA ================= */
function Luna(parent){

    </g>

    <g class="bow" display="none"><path d="M30,-66 L14,-78 L14,-54Z M30,-66 L46,-78 L46,-54Z" fill="#ff5d8f" stroke="${OUT}" stroke-width="3"/><circle cx="30" cy="-66" r="6" fill="#ff5d8f" stroke="${OUT}" stroke-width="3"/></g>
   </g></g>`);
  const lg=q(g,'lg');const L=[-34,-14,18,36].map(x=>add(lg,`<rect x="${x-8}" y="-30" width="16" height="32" rx="8" fill="#f7e6c8" stroke="${OUT}" stroke-width="4"/>`));

    q(g,'eL').setAttribute('transform',`rotate(${Math.sin(d.t*9)*8},14,-100)`);q(g,'eR').setAttribute('transform',`rotate(${-Math.sin(d.t*9)*8},68,-104)`);

function heartsFX(parent,n,{x0=960,y0=540,spread=900,col=['#ff5d73','#ff8fab','#ffd1dc']}={}){const G=add(parent,'<g></g>');const A=[];
  for(let i=0;i<n;i++)A.push({e:add(G,`<use href="#heart" fill="${col[i%col.length]}" stroke="${OUT}" stroke-width=".1"/>`),x:x0+(rnd()-.5)*spread,y:y0+rnd()*200,s:10+rnd()*18,v:60+rnd()*90,ph:rnd()*6,d:rnd()*3});
  return (t,on=1)=>A.forEach(a=>{const tt=t-a.d;const y=a.y-tt*a.v;const show=on&&tt>0;a.e.setAttribute('display',show?'inline':'none');if(!show)return;
    a.e.setAttribute('transform',`translate(${a.x+Math.sin(tt*2+a.ph)*30},${y}) rotate(${Math.sin(tt*3+a.ph)*15}) scale(${a.s*Math.min(1,tt*3)})`);a.e.setAttribute('opacity',clamp(1-(a.y-y)/700))})}
function burst(parent,n,cx,cy,{col=['#ff5d73','#ff8fab','#ffd27a','#fff'],dist=300,size=22,shape='heart'}={}){const G=add(parent,'<g></g>');const A=[];
  for(let i=0;i<n;i++)A.push({e:add(G,`<use href="#${shape}" fill="${col[i%col.length]}" stroke="${OUT}" stroke-width=".08"/>`),a:i/n*6.28+rnd()*.3,d:dist*(.6+rnd()*.6),s:size*(.6+rnd()*.7)});
  return (p,x=cx,y=cy)=>A.forEach(a=>{const sz=a.s*Math.sin(clamp(p)*Math.PI);a.e.setAttribute('display',p>0&&p<1?'inline':'none');
    a.e.setAttribute('transform',`translate(${x+Math.cos(a.a)*a.d*easeOut(p)},${y+Math.sin(a.a)*a.d*easeOut(p)+p*p*80}) rotate(${p*120}) scale(${Math.max(.01,sz)})`)})}
function bubble(parent,inner){const g=add(parent,`<g><path d="M-80,-60 Q-80,-110 -30,-110 H30 Q80,-110 80,-60 Q80,-10 30,-10 H6 L-14,22 L-12,-10 H-30 Q-80,-10 -80,-60Z" fill="#fff" stroke="${OUT}" stroke-width="6" stroke-linejoin="round"/>${inner}</g>`);
  return (p,x,y,flip=1)=>{g.setAttribute('display',p>0?'inline':'none');g.setAttribute('transform',`translate(${x},${y}) scale(${flip*backOut(clamp(p))},${backOut(clamp(p))})`)}}
function istanbulSkyline(c,col,y=760){return add(c,`<g fill="${col}">
   <path d="M0,${y} V${y-60} H120 V${y-90} H200 V${y-50} H300 V${y}Z"/>

   <g transform="translate(860,${y})"><path d="M-170,0 V-90 Q-170,-150 -110,-150 Q-110,-230 0,-240 Q110,-230 110,-150 Q170,-150 170,-90 V0Z"/>
    ${[-240,-200,200,240].map(x=>`<rect x="${x-9}" y="-330" width="18" height="330"/><path d="M${x-12},-330 L${x},-380 L${x+12},-330Z"/>`).join('')}<rect x="-4" y="-275" width="8" height="40"/></g>
   <path d="M1120,${y} V${y-80} H1220 V${y-120} H1300 V${y-70} H1420 V${y-100} H1500 V${y}Z"/>
   <g transform="translate(1660,${y})"><path d="M-110,0 V-70 Q-110,-120 -60,-120 Q-60,-180 0,-186 Q60,-180 60,-120 Q110,-120 110,-70 V0Z"/>${[-140,140].map(x=>`<rect x="${x-8}" y="-260" width="16" height="260"/><path d="M${x-10},-260 L${x},-300 L${x+10},-260Z"/>`).join('')}</g>

/* ================= HEART IRIS ================= */
function heartPath(cx,cy,r){const P=[[0,0.9],[-0.6,0.45],[-1,0.1],[-1,-0.3],[-1,-0.75],[-0.55,-1],[-0.25,-0.85],[-0.1,-0.78],[0,-0.65],[0,-0.6],[0,-0.65],[0.1,-0.78],[0.25,-0.85],[0.55,-1],[1,-0.75],[1,-0.3],[1,0.1],[0.6,0.45],[0,0.9]].map(([x,y])=>`${(cx+x*r).toFixed(1)},${(cy+y*r).toFixed(1)}`);
  return `path('M${P[0]} C${P[1]} ${P[2]} ${P[3]} C${P[4]} ${P[5]} ${P[6]} C${P[7]} ${P[8]} ${P[9]} C${P[10]} ${P[11]} ${P[12]} C${P[13]} ${P[14]} ${P[15]} C${P[16]} ${P[17]} ${P[18]}Z')`}

/* ================= RENDER ================= */
function render(t){
  scenes.forEach((s,i)=>{const next=scenes[i+1];const v=t>=s.start-(s.trans==='none'?0:TR)&&t<s.end;s.div.style.display=v?'block':'none';if(!v)return;
    let tx=0,blur=0,clip='none';
    if(t<s.start){const p=eio(prog(t,s.start-TR,s.start));if(s.trans==='whip'){tx=(1-p)*W;blur=Math.sin(p*Math.PI)*16}if(s.trans==='heart')clip=heartPath(960,560,p*1500)}
    if(next&&next.trans==='whip'&&t>=next.start-TR){const p=eio(prog(t,next.start-TR,next.start));tx=-p*W;blur=Math.sin(p*Math.PI)*16}
    s.div.style.transform=`translateX(${tx}px)`;s.div.style.filter=blur>.5?`blur(${blur}px)`:'none';s.div.style.clipPath=clip;s.update(t-s.start)});
  [...$('title').children].forEach((e,i)=>{const p=prog(t,.5+i*.45,1.1+i*.45),o=prog(t,4.2,4.7);e.style.opacity=p>0?1-o:0;e.style.transform=`scale(${elastic(p)}) translateY(${-o*30}px)`});
  [...$('end').children].forEach((e,i)=>{const p=prog(t,55.4+i*.45,56+i*.45);e.style.opacity=p>0?1:0;e.style.transform=`scale(${elastic(p)})`});
  const ch=chapters.find(c=>t>=c[0]&&t<c[1]);const chap=$('chap');
  if(ch){const p=prog(t,ch[0]+.3,ch[0]+.8),o=prog(t,ch[1]-.4,ch[1]);chap.style.opacity=Math.min(p,1-o);chap.style.transform=`translateX(${(1-easeOut(p))*-60}px)`;
    chap.children[0].textContent=ch[2];chap.children[1].textContent=ch[3];chap.children[2].textContent=ch[4]}else chap.style.opacity=0;
  caps.forEach(c=>{const pin=prog(t,c.a,c.a+.5),pout=prog(t,c.b-.3,c.b);const v=pin>0&&pout<1;c.e.style.display=v?'flex':'none';if(!v)return;
    c.e.style.opacity=1-pout;c.e.style.transform=`translateX(-50%) translateY(${pout*50}px) scale(${elastic(pin)*(1-pout*.1)}) rotate(${Math.sin(t*2.5)*.7}deg)`});
  $('flash').style.opacity=Math.max(pulse(t,35.05,.004)*.7,0);
  $('stage').style.opacity=Math.min(prog(t,0,.5),1-prog(t,59.2,60));
}
